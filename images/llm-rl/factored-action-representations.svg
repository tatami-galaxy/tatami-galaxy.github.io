<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
<title id="title">The same actions can be learned through different representations</title><desc id="desc">Flat and factored representations of the same 18 Atari actions. Horizontal movement has three choices, vertical movement has three choices, and firing has two choices. Up-right-fire is highlighted in both representations. Shared factor outputs also affect other combinations. The paper reports higher FARA3C scores than A3C on nine of fourteen tasks, with the baseline higher on the other five; marks summarize counts, not effect sizes.</desc>
